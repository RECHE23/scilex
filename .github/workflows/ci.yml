name: CI

# SciLex depends on REAL's headers. CI checks out REAL (public) as a sibling so
# the Makefile's default resolution (../real-regex/include) finds it — no secret needed.
#
# Actions-minute economy (macOS runners bill 10x): macOS is the maintainer's local
# development platform — every gate
# runs there via `make full-local-gate` on each slice — so CI deliberately omits macOS
# and covers the *non-local* platforms instead: Linux (clang + g++-14), Windows/MSVC
# and ARM. Run on main only (plus PRs); workflow_dispatch is available for ad-hoc runs.
# Doc-only pushes are skipped. Coverage runs here too, under Linux clang, against the same 100 % bar.

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:

jobs:
  # Lint (format + MISRA) via SciForge's reusable spine: pins clang-tidy-18 and runs
  # this repo's make format-check / misra against the shared lint/ config. SciLex's
  # MISRA TU needs REAL's headers, so real-regex is checked out as a dep sibling.
  lint:
    uses: RECHE23/sciforge/.github/workflows/lint-cpp.yml@v2026.9.2
    with:
      deps: '[{"repo":"RECHE23/real-regex","path":"real-regex","ref":"v2026.9.7"}]'
      sciforge-ref: v2026.9.2
      runner-mode: hosted

  # POSIX + CMake build via SciForge's reusable build spine: the Makefile under
  # g++-14 + clang++ with sanitizers (Linux baseline), and CMake configure/build/
  # test/install + find_package smoke across linux-x64, Windows/MSVC and native ARM
  # — matching SciLex's prior coverage exactly. The single REAL dependency (public,
  # so no ci-pat) is installed first so find_package(scilex) resolves real::.
  build:
    uses: RECHE23/sciforge/.github/workflows/build-cpp.yml@v2026.9.2
    with:
      deps: '[{"repo":"RECHE23/real-regex","path":"real-regex","ref":"v2026.9.7"}]'
      sciforge-ref: v2026.9.2
      runner-mode: hosted
      enable-windows-msvc: true
      enable-arm: true

  # Python binding (abi3) build + unittest via SciForge's reusable spine. The lexer
  # binding has no platform-specific interop, so Linux suffices: linux x {3.11, 3.14}, 3.11 being the
  # floor real-regex, the build dependency, requires. It compiles against REAL's headers, passed as a
  # dependency sibling (public, so no ci-pat). The stub is checked against the runtime (stubtest)
  # before the unit tests, with mypy pinned as real-regex pins it.
  python:
    uses: RECHE23/sciforge/.github/workflows/python-cpp.yml@v2026.9.2
    with:
      python-versions: '["3.11","3.14"]'
      sciforge-ref: v2026.9.2
      deps: '[{"repo":"RECHE23/real-regex","path":"real-regex","ref":"v2026.9.7"}]'
      test-cmd: 'python -m pip install mypy==2.3.0 && python -m mypy.stubtest scilex && python -m unittest discover -s python/tests'
      runner-mode: hosted

  # Exhaustive lexer-oracle net, promoted from the local gate now that the enumerator substrate is
  # pinnable: scilex::lexer vs reference.hpp over every small rule-set x input, under both error policies.
  # Also runs the pin-drift lint on this repo's workflows. REAL (headers) and SciForge (framework +
  # enumerator) are checked out as siblings at the releases the rest of CI pins; the PR tier is ~10 s.
  exhaustive-lex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: scilex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/real-regex
          ref: v2026.9.7
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.9.2
          path: sciforge
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install cmake + clang
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Pin-drift lint (SciForge pins consistent)
        run: bash sciforge/tools/check-pins.sh scilex
      - name: Exhaustive lexer-oracle check (scilex::lexer vs reference.hpp)
        run: make -C scilex exhaustive-lex

  # The property oracle, twice: fuzz-check over the fixed adversarial inputs and every example grammar
  # (deterministic, scaling cases included), then a libFuzzer smoke from a fresh corpus. The smoke catches
  # what crashes early; the weekly fuzz-long workflow gives the same target hours and a kept corpus.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: scilex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/real-regex
          ref: v2026.9.7
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.9.2
          path: sciforge
      - name: Install clang + libFuzzer
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: Deterministic oracle (fuzz-check)
        run: make -C scilex fuzz-check
      - name: libFuzzer smoke (ASan + UBSan)
        run: make -C scilex fuzz FUZZ_TIME=120 FUZZ_CLANG=clang++-18
      - name: Upload the findings
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            scilex/build/fuzz/crash-*
            scilex/build/fuzz/leak-*
            scilex/build/fuzz/timeout-*
            scilex/build/fuzz/oom-*
            scilex/build/fuzz/slow-unit-*
          if-no-files-found: warn

  # The coverage bar of the local gate, measured by a second toolchain: Linux clang's source-based
  # coverage must also reach 100 % on every dimension of include/.
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: scilex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/real-regex
          ref: v2026.9.7
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.9.2
          path: sciforge
      - name: Install clang + llvm
        run: sudo apt-get update && sudo apt-get install -y clang-18 llvm-18 cmake
      - name: Coverage at 100 % (coverage-gate)
        run: make -C scilex coverage-gate COV_CXX=clang++-18 PROFDATA=llvm-profdata-18 LLVM_COV=llvm-cov-18

  # A 32-bit build, run: size_t and pointers of 32 bits, every test executed, not only compiled. The
  # binary's ELF class is checked, so a toolchain that ignored -m32 cannot pass for one that did not.
  i686:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: scilex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/real-regex
          ref: v2026.9.7
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.9.2
          path: sciforge
      - name: Install the 32-bit toolchain
        run: sudo apt-get update && sudo apt-get install -y g++-multilib cmake
      - name: Build and test with -m32
        run: make -C scilex test CXX=g++ BUILD=build32 "CMAKE_CXX=-DCMAKE_CXX_COMPILER=g++ -DCMAKE_CXX_FLAGS=-m32"
      - name: The test binary is 32-bit
        run: readelf -h scilex/build32/scilex_tests_bin | grep -q 'Class:.*ELF32'
