name: Docs

# Build the site -- the Sphinx guides and references at the root, the Doxygen API reference (with the
# embedded coverage report and the guided tour) under api/ -- and publish it to GitHub Pages on every
# push to the default branch.
# Enable Pages once in the repository settings with "GitHub Actions" as the source.
# SciLex compiles against REAL's headers, so REAL is checked out as a sibling
# (mirroring ci.yml) for the coverage build that `make doc` runs.
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; supersede an in-flight run with the latest.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          path: scilex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/real-regex
          path: real-regex
      - uses: actions/checkout@v6
        with:
          repository: RECHE23/sciforge
          ref: v2026.9.2
          path: sciforge
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Install Doxygen, Graphviz, Clang and LLVM coverage tools
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz clang llvm
      - name: Install the extension's build backend (the Python reference imports the built module)
        run: python -m pip install setuptools
      - name: The site's gate (every Sphinx warning fatal, every shown example run)
        run: make -C scilex docs-site-gate
      - name: Build the site (guides and references, the Doxygen reference and coverage under api/)
        run: make -C scilex docs-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: scilex/build/site/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
