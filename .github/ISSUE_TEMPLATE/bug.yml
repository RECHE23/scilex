name: Bug report
description: A wrong answer, a crash, a hang, or a build that fails.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Thanks for the report. A security issue goes through private reporting instead (see SECURITY.md), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The SciLex release (`pip show scilex`, or the git tag or commit).
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, processor, compiler and its version (or the Python version and the wheel).
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest example that shows it — the grammar (rules or a `.lex` file), the input, and the tokens you expected.
      render: text
      placeholder: |
        import scilex
        lx = scilex.Lexer([(0, r"\s+", True), (1, r"[a-z]+")])
        print(lx.tokenize("ab cd"))
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
